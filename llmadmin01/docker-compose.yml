x-runner-base: &runner-base
  image: ghcr.io/rpdevs-vault/runner-linux-builder:latest
  restart: always
  volumes:
    # --- Centralized Shared AppData (SDKs, Toolchains) ---
    - /mnt/sharedroot/github_runners/shared/appdata:/home/runner/appdata
    # --- Shared Long-Term Cache ---
    - /mnt/sharedroot/github_runners/shared/apt-cache:/var/cache/apt/archives
    - /mnt/sharedroot/github_runners/shared/ccache:/home/runner/.ccache
    - /mnt/sharedroot/github_runners/shared/kodi-depends:/home/runner/.kodi-depends
    - /mnt/sharedroot/github_runners/shared/go-cache:/home/runner/go
    - /mnt/sharedroot/github_runners/shared/npm-cache:/home/runner/.npm
    - /mnt/sharedroot/github_runners/shared/cargo-home:/home/runner/.cargo
    # --- Node-Specific & Meta ---
    - /mnt/sharedroot/github_runners/shared:/home/runner/shared
    - /mnt/sharedroot/github_runners/llmadmin01:/home/runner/outputs
    - /var/run/docker.sock:/var/run/docker.sock

services:
  # --- RPDevs-Builds (Primary Build Org) ---
  # Heavy Builds migrate to direct NVMe (SSD) to avoid Zram instability during peak I/O
  builds-heavy:
    <<: *runner-base
    container_name: builds-heavy-01
    environment:
      - GH_OWNER=RPDevs-Builds
      - GH_TOKEN=${GH_PAT}
      - RUNNER_NAME=llmadmin-builds-heavy-v3
      - RUNNER_LABELS=self-hosted,linux,heavy,linux64
      - CCACHE_DIR=/home/runner/.ccache
    volumes:
      - /mnt/largedata/github_runners/work_ssd/builds-heavy:/home/runner/_work
      # Shared volumes...
      - /mnt/sharedroot/github_runners/shared/appdata:/home/runner/appdata
      - /mnt/sharedroot/github_runners/shared/apt-cache:/var/cache/apt/archives
      - /mnt/sharedroot/github_runners/shared/ccache:/home/runner/.ccache
      - /mnt/sharedroot/github_runners/shared/kodi-depends:/home/runner/.kodi-depends
      - /mnt/sharedroot/github_runners/shared:/home/runner/shared
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 12G

  builds-lite:
    <<: *runner-base
    container_name: builds-lite-01
    environment:
      - GH_OWNER=RPDevs-Builds
      - GH_TOKEN=${GH_PAT}
      - RUNNER_NAME=llmadmin-builds-lite-01
      - RUNNER_LABELS=self-hosted,linux,lite,lightweight
    volumes:
      - /mnt/largedata/github_runners/work_ssd/builds-lite:/home/runner/_work
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # --- RPDevs-Vault (Archival/Management Org) ---
  vault-heavy:
    <<: *runner-base
    container_name: vault-heavy-01
    environment:
      - GH_OWNER=RPDevs-Vault
      - GH_TOKEN=${GH_PAT}
      - RUNNER_NAME=llmadmin-vault-heavy-01
      - RUNNER_LABELS=self-hosted,linux,heavy,linux64
    volumes:
      - /mnt/largedata/github_runners/work_ssd/vault-heavy:/home/runner/_work
      # Shared volumes...
      - /mnt/sharedroot/github_runners/shared/appdata:/home/runner/appdata
      - /mnt/sharedroot/github_runners/shared/apt-cache:/var/cache/apt/archives
      - /mnt/sharedroot/github_runners/shared/ccache:/home/runner/.ccache
      - /mnt/sharedroot/github_runners/shared/kodi-depends:/home/runner/.kodi-depends
      - /mnt/sharedroot/github_runners/shared:/home/runner/shared
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 12G

  vault-lite:
    <<: *runner-base
    container_name: vault-lite-01
    environment:
      - GH_OWNER=RPDevs-Vault
      - GH_TOKEN=${GH_PAT}
      - RUNNER_NAME=llmadmin-vault-lite-01
      - RUNNER_LABELS=self-hosted,linux,lite,lightweight
    volumes:
      - /mnt/largedata/github_runners/work_ssd/vault-lite:/home/runner/_work
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # --- IamRPDev (User Account) ---
  user-lite:
    <<: *runner-base
    container_name: iamrpdev-lite-01
    environment:
      - GH_OWNER=IamRPDev
      - GH_TYPE=user
      - GH_TOKEN=${GH_PAT}
      - RUNNER_NAME=llmadmin-iamrpdev-lite-01
      - RUNNER_LABELS=self-hosted,linux,lite,lightweight
    volumes:
      - /mnt/largedata/github_runners/work_ssd/user-lite:/home/runner/_work
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
