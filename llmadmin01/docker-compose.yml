x-runner-base: &runner-base
  image: ghcr.io/rpdevs-vault/runner-linux-builder:latest
  restart: always
  volumes:
    # --- Centralized Shared AppData (SDKs, Toolchains) ---
    - /mnt/sharedroot/github_runners/shared/appdata:/home/runner/appdata
    - /mnt/sharedroot/github_runners/android-sdk:/opt/android-sdk
    # --- Shared Long-Term Cache ---
    - /mnt/sharedroot/github_runners/shared/apt-cache:/var/cache/apt/archives
    - /mnt/sharedroot/github_runners/shared/ccache:/home/runner/.ccache
    - /mnt/sharedroot/github_runners/shared/kodi-depends:/home/runner/.kodi-depends
    - /mnt/sharedroot/github_runners/shared/go-cache:/home/runner/go
    - /mnt/sharedroot/github_runners/shared/npm-cache:/home/runner/.npm
    - /mnt/sharedroot/github_runners/shared/cargo-home:/home/runner/.cargo
    # --- Node-Specific & Meta ---
    - /mnt/sharedroot/github_runners/shared:/home/runner/shared
    - /mnt/sharedroot/github_runners/llmadmin01:/home/runner/outputs
    - /var/run/docker.sock:/var/run/docker.sock

services:
  # --- RPDevs-Builds (Primary Build Org Super Runner) ---
  builds-super:
    <<: *runner-base
    container_name: builds-super-01
    environment:
      - GH_OWNER=RPDevs-Builds
      - GH_TOKEN=${GH_PAT}
      - RUNNER_NAME=llmadmin-builds-super-01
      - RUNNER_LABELS=self-hosted,linux64,lightweight,medium,heavy
    volumes:
      - /mnt/largedata/github_runners/work_ssd/builds-super:/home/runner/_work

  # --- RPDevs-Vault (Archival/Management Org Super Runner) ---
  vault-super:
    <<: *runner-base
    container_name: vault-super-01
    environment:
      - GH_OWNER=RPDevs-Vault
      - GH_TOKEN=${GH_PAT}
      - RUNNER_NAME=llmadmin-vault-super-01
      - RUNNER_LABELS=self-hosted,linux64,lightweight,medium,heavy
    volumes:
      - /mnt/largedata/github_runners/work_ssd/vault-super:/home/runner/_work

  # --- IamRPDev (User Account Super Runner) ---
  iamrpdev-super:
    <<: *runner-base
    container_name: iamrpdev-super-01
    environment:
      - GH_OWNER=IamRPDev
      - GH_TYPE=user
      - GH_TOKEN=${GH_PAT}
      - RUNNER_NAME=llmadmin-iamrpdev-super-01
      - RUNNER_LABELS=self-hosted,linux64,lightweight
    volumes:
      - /mnt/largedata/github_runners/work_ssd/user-super:/home/runner/_work
